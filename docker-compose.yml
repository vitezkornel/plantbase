services:
  postgres:
    image: postgres:16
    container_name: plantbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantbase}
      POSTGRES_DB: ${POSTGRES_DB:-plantbase}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - plantbase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-plantbase} -d ${POSTGRES_DB:-plantbase}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plantbase_postgres_data:
